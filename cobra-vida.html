
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mi calaverita cobra vida</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160d25;color:white;font-family:system-ui}
#scene{position:fixed;inset:0}
#ui{position:fixed;z-index:3;left:12px;right:12px;top:10px;text-align:center;pointer-events:none}
h1{font-size:20px;margin:0;color:#ffca69;text-shadow:0 2px 7px #000}
#stage{margin-top:6px;font-weight:700}
#bottom{position:fixed;bottom:14px;left:12px;right:12px;display:flex;justify-content:center;gap:10px;z-index:4}
button,a{background:#ffb443;color:#2a1538;border:0;border-radius:12px;padding:12px 16px;font-weight:bold;text-decoration:none;font-size:14px}
#hint{position:fixed;bottom:73px;left:10px;right:10px;text-align:center;color:#f5e6ff;font-size:13px;pointer-events:none}
a{background:#d3b5ff}
</style>
</head>
<body>

<div id="scene"></div>

<div id="ui">
<h1>💀 Mi calaverita cobra vida</h1>
<div id="stage">Preparando magia...</div>
</div>

<div id="hint">
Arrastra para girar · Pellizca para acercar · La historia se repite
</div>

<div id="bottom">
<button id="replay">↻ Repetir historia</button>
<a href="index.html">⌂ Inicio</a>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ESCENA
const scene=new THREE.Scene();
scene.background=new THREE.Color('#1b102e');
scene.fog=new THREE.Fog('#1b102e',8,18);

const camera=new THREE.PerspectiveCamera(
  50,innerWidth/innerHeight,.1,100
);
camera.position.set(0,2.25,6.5);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('scene').appendChild(renderer.domElement);

// ILUMINACION
scene.add(new THREE.HemisphereLight(0xbba8ff,0x51321b,2));

const light=new THREE.PointLight(0xffa636,85,11);
light.position.set(0,3,-2);
scene.add(light);

const front=new THREE.DirectionalLight(0xffffff,2);
front.position.set(2,5,5);
scene.add(front);

// CONTROLES
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,1.35,0);
controls.enableDamping=true;
controls.minDistance=3;
controls.maxDistance=10;
controls.maxPolarAngle=Math.PI*.53;

// MATERIALES Y FORMAS
const mat=(c,em=0)=>new THREE.MeshStandardMaterial({
  color:c,roughness:.62,emissive:c,emissiveIntensity:em
});

const bone=mat('#eee6cf');
const ink=mat('#1d1725');
const navy=mat('#14254c');
const gold=mat('#ffc044',.25);
const orange=mat('#f78012',.25);
const purple=mat('#9b54e8',.3);
const shoe=mat('#492c26');

function add(parent,geo,m,x=0,y=0,z=0){
  const o=new THREE.Mesh(geo,m);
  o.position.set(x,y,z);
  parent.add(o);
  return o;
}

function ball(parent,r,m,x,y,z,sx=1,sy=1,sz=1){
  const o=add(parent,new THREE.SphereGeometry(r,18,12),m,x,y,z);
  o.scale.set(sx,sy,sz);
  return o;
}

function box(parent,w,h,d,m,x,y,z){
  return add(parent,new THREE.BoxGeometry(w,h,d),m,x,y,z);
}

function rod(parent,a,b,r,m){
  const dir=new THREE.Vector3().subVectors(
    new THREE.Vector3(...b),new THREE.Vector3(...a)
  );
  const center=new THREE.Vector3(...a)
    .add(new THREE.Vector3(...b))
    .multiplyScalar(.5);
  const o=add(
    parent,
    new THREE.CylinderGeometry(r,r,dir.length(),10),
    m,...center.toArray()
  );
  o.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),dir.normalize()
  );
  return o;
}

// SUELO Y PORTAL
add(scene,new THREE.CylinderGeometry(5.2,5.2,.13,64),
  mat('#302044'),0,-.14,0);

const portal=new THREE.Group();
portal.position.set(0,1.65,-2.15);
scene.add(portal);

const ring=add(portal,new THREE.TorusGeometry(1.25,.095,14,72),gold);
const ring2=add(portal,new THREE.TorusGeometry(1.05,.04,10,72),purple);

const inner=add(
  portal,
  new THREE.CircleGeometry(1.02,64),
  new THREE.MeshBasicMaterial({
    color:0x7138c4,transparent:true,
    opacity:.37,side:THREE.DoubleSide
  })
);
inner.position.z=-.05;

for(let i=0;i<24;i++){
  const a=i/24*Math.PI*2;
  ball(portal,.085,i%2?orange:gold,
    1.26*Math.cos(a),1.26*Math.sin(a),.03);
}

for(let i=0;i<32;i++){
  const a=i*2.4;
  ball(scene,.05,i%2?orange:gold,
    Math.sin(a)*2.7,.04,Math.cos(a)*2.2);
}

for(const x of [-1.55,1.55]){
  box(scene,.14,.35,.14,bone,x,.18,-1.5);
  ball(scene,.09,orange,x,.45,-1.5,.7,1.5,.7);
}

// CALAVERITA
const doll=new THREE.Group();
scene.add(doll);

const hips=new THREE.Group();
hips.position.y=1.15;
doll.add(hips);

ball(hips,.28,bone,0,.08,0,1.3,.7,.6);

const torso=new THREE.Group();
torso.position.y=.28;
hips.add(torso);

box(torso,.78,.82,.25,navy,0,.45,0);
box(torso,.09,.74,.28,ink,0,.45,.01);

for(let y of [.30,.56]){
  ball(torso,.045,bone,0,y,.17);
}

rod(torso,[0,.83,0],[0,1.02,0],.07,bone);

const head=new THREE.Group();
head.position.set(0,1.22,.02);
torso.add(head);

ball(head,.47,bone,0,.27,0,1.05,1.06,.66);
ball(head,.33,bone,0,-.03,.1,1,.47,.6);

for(const x of [-.18,.18]){
  ball(head,.13,ink,x,.29,.29,1,1,.28);
}

ball(head,.07,ink,0,.07,.36,.7,1,.25);
box(head,.49,.055,.04,ink,0,-.10,.32);

for(let i=-2;i<=2;i++){
  box(head,.015,.09,.045,ink,i*.09,-.1,.35);
}

function arm(x){
  const pivot=new THREE.Group();
  pivot.position.set(x*.43,.78,0);
  torso.add(pivot);

  rod(pivot,[0,0,0],[x*.08,-.38,.05],.075,bone);
  ball(pivot,.10,bone,x*.08,-.38,.05);
  rod(pivot,[x*.08,-.38,.05],[x*.08,-.75,.22],.06,bone);
  ball(pivot,.13,bone,x*.08,-.81,.24,1,.7,.4);

  for(let j=0;j<4;j++){
    rod(pivot,
      [x*.08+(j-1.5)*.035,-.83,.25],
      [x*.08+(j-1.5)*.055,-.99,.29],
      .018,bone);
  }
  return pivot;
}

const left=arm(-1);
const right=arm(1);

function leg(x){
  const pivot=new THREE.Group();
  pivot.position.set(x*.2,0,0);
  hips.add(pivot);

  rod(pivot,[0,0,0],[x*.04,-.43,.02],.09,bone);
  ball(pivot,.09,bone,x*.04,-.43,.02);
  rod(pivot,[x*.04,-.43,.02],[x*.05,-.94,.06],.07,bone);
  ball(pivot,.12,shoe,x*.05,-1.02,.19,1.2,.55,2.1);

  return pivot;
}

const ll=leg(-1);
const rr=leg(1);
doll.position.set(0,0,1.3);

// LAPTOP 3D
const laptop=new THREE.Group();
scene.add(laptop);

const metal=mat('#535c73');
const keyboard=mat('#171b29');

box(laptop,.72,.045,.46,metal,0,0,0);

const screen=new THREE.Group();
screen.position.set(0,.025,-.21);
laptop.add(screen);

box(screen,.72,.48,.035,metal,0,.24,0);
box(screen,.62,.37,.04,
  new THREE.MeshBasicMaterial({color:0x5bd5ff}),
  0,.25,.025);

for(let row=0;row<3;row++){
  for(let col=0;col<8;col++){
    box(laptop,.065,.008,.045,keyboard,
      (col-3.5)*.082,.027,(row-1)*.105+.04);
  }
}

// ANIMACION COMPLETA
let start=performance.now();
const stage=document.getElementById('stage');

document.getElementById('replay').onclick=()=>{
  start=performance.now();
};

function smooth(x){
  x=Math.max(0,Math.min(1,x));
  return x*x*(3-2*x);
}

function tick(now){
  requestAnimationFrame(tick);

  const t=((now-start)/1000)%20;
  const s=now*.001;

  ring.rotation.z=s*.15;
  ring2.rotation.z=-s*.23;
  light.intensity=75+15*Math.sin(s*2);

  // Restaurar articulaciones
  doll.position.set(0,0,1.3);
  doll.scale.setScalar(1);
  hips.rotation.set(0,0,0);
  torso.rotation.set(0,0,0);
  left.rotation.set(0,0,0);
  right.rotation.set(0,0,0);
  ll.rotation.set(0,0,0);
  rr.rotation.set(0,0,0);
  head.rotation.set(0,0,0);

  laptop.visible=true;
  laptop.position.set(0,1.65,1.92);
  laptop.rotation.set(0,0,0);
  laptop.scale.setScalar(1);

  if(t<5){
    // TRABAJANDO
    stage.textContent='💻 ¡Ni muerto dejo de trabajar!';

    const typing=Math.sin(t*17);
    torso.rotation.x=.12;
    head.rotation.x=-.13;

    left.rotation.x=-1.15+typing*.12;
    right.rotation.x=-1.15-typing*.12;
    left.rotation.z=-.15;
    right.rotation.z=.15;

    laptop.position.set(0,1.62,1.94);
    laptop.rotation.x=-.12;

  }else if(t<8){
    // LANZAMIENTO
    stage.textContent='😤 ¡MÁS TICKETTSSSSS!';

    const d=t-5;

    if(d<1){
      const p=smooth(d);

      head.rotation.z=Math.sin(d*10)*.14;
      torso.rotation.x=-.2*p;
      left.rotation.x=-1.1-p*.8;
      right.rotation.x=-1.1-p*.8;

      laptop.position.set(0,1.62+p*.45,1.94);
      laptop.rotation.x=-.12-p*.5;

    }else{
      const f=d-1;

      laptop.position.set(
        f*2.6,
        2.07+f*1.8-f*f*1.5,
        1.94-f*.6
      );

      laptop.rotation.set(f*5,f*3,f*7);

      left.rotation.z=-.9;
      right.rotation.z=.9;
      head.rotation.z=-.12;
    }

  }else if(t<15){
    // BAILE
    stage.textContent='💃 ¡Se cayó el sistema...BAILEMOS!';

    laptop.visible=false;
    const d=t-8;

    doll.position.set(
      Math.sin(d*3)*.3,
      Math.abs(Math.sin(d*7))*.15,
      1.3
    );

    hips.rotation.y=Math.sin(d*3)*.3;
    torso.rotation.z=Math.sin(d*5)*.14;

    left.rotation.z=-.95+Math.sin(d*6)*.55;
    right.rotation.z=.95-Math.sin(d*6)*.55;

    left.rotation.x=-.3;
    right.rotation.x=-.3;

    ll.rotation.x=Math.sin(d*7)*.65;
    rr.rotation.x=-Math.sin(d*7)*.65;

    head.rotation.z=Math.sin(d*4)*.15;

  }else{
    // ENTRADA AL PORTAL
    stage.textContent='✨ ¡Me voy al más allá!';

    laptop.visible=false;
    const f=smooth((t-15)/5);

    doll.position.set(0,0,1.3-f*2.5);
    doll.scale.setScalar(1-f*.55);

    ll.rotation.x=Math.sin(s*9)*.6;
    rr.rotation.x=-Math.sin(s*9)*.6;
    left.rotation.x=Math.sin(s*9)*.25;
    right.rotation.x=-Math.sin(s*9)*.25;
  }

  controls.update();
  renderer.render(scene,camera);
}

requestAnimationFrame(tick);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
