
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Calaverita mágica — reconocimiento automático</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#120a20;color:white;font-family:system-ui,Arial,sans-serif
}
#cam,#overlay{
  position:fixed;inset:0;width:100%;height:100%
}
#cam{object-fit:cover}
#overlay{pointer-events:none}
#info{
  position:fixed;z-index:3;
  top:calc(10px + env(safe-area-inset-top));
  left:10px;right:10px;
  background:#251635e8;
  border:1px solid #ffbd60;
  border-radius:12px;
  padding:10px;text-align:center;
  line-height:1.4;font-size:13px
}
#info strong{color:#ffd27d}
#controls{
  position:fixed;z-index:3;
  bottom:calc(12px + env(safe-area-inset-bottom));
  left:8px;right:8px;
  display:flex;justify-content:center;
  gap:9px;flex-wrap:wrap
}
button,a{
  border:0;border-radius:12px;padding:11px 14px;
  font:700 13px system-ui;text-decoration:none;
  background:#ffbf58;color:#26152b
}
a{background:#dfc4ff}
#replay{display:none}
#loading{
  position:fixed;z-index:2;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(90%,350px);text-align:center;
  background:#28163eea;padding:20px;
  border-radius:16px;line-height:1.5
}
</style>
</head>
<body>

<video id="cam" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>

<div id="info">
  <strong>💀 Mi calaverita cobra vida</strong>
  <div id="status">Iniciando reconocimiento...</div>
</div>

<div id="loading">
  📷 Permite la cámara y apunta de frente a tu calaverita física.
</div>

<div id="controls">
  <button id="replay">↻ Repetir historia</button>
  <a href="index.html">⌂ Inicio</a>
</div>

<script>
const video=document.getElementById('cam');
const canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
const loading=document.getElementById('loading');
const replay=document.getElementById('replay');

let cvReady=false;
let camReady=false;
let ref=null;
let detector=null;
let matcher=null;
let gray=null;
let sceneKey=null;
let sceneDesc=null;
let mask=null;
let refKey=null;
let refDesc=null;
let maskEmpty=null;
let tracking=null;
let confirmed=0;
let missing=0;
let storyStart=0;
let playing=false;
let lastScan=0;
let scanBusy=false;

const scanCanvas=document.createElement('canvas');
scanCanvas.width=640;
scanCanvas.height=480;
const scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true});

function say(t){
  status.textContent=t;
}

function showError(t){
  loading.style.display='block';
  loading.textContent=t;
  say('No se pudo iniciar. Revisa el mensaje central.');
}

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=src;
    s.async=true;
    s.onload=resolve;
    s.onerror=()=>reject(new Error('No se pudo cargar OpenCV'));
    document.head.appendChild(s);
  });
}

async function waitCV(){
  await loadScript('https://docs.opencv.org/4.x/opencv.js');
  let tries=0;
  while((!window.cv||!cv.Mat||!cv.ORB)&&tries++<120){
    await new Promise(r=>setTimeout(r,150));
  }
  if(!window.cv?.ORB){
    throw new Error('OpenCV no terminó de cargar o no incluye ORB');
  }
  cvReady=true;
}

async function loadReference(){
  const image=new Image();
  image.src='calaverita-referencia.png?v=1';
  await image.decode();

  const tmp=document.createElement('canvas');
  const f=Math.min(1,680/image.height);
  tmp.width=Math.round(image.width*f);
  tmp.height=Math.round(image.height*f);

  const c=tmp.getContext('2d');
  c.drawImage(image,0,0,tmp.width,tmp.height);

  const rgba=cv.imread(tmp);
  const channels=new cv.MatVector();
  cv.split(rgba,channels);

  mask=channels.get(3).clone();

  const rgb=new cv.Mat();
  cv.cvtColor(rgba,rgb,cv.COLOR_RGBA2GRAY);

  refKey=new cv.KeyPointVector();
  refDesc=new cv.Mat();
  detector=new cv.ORB(1200);
  matcher=new cv.BFMatcher(cv.NORM_HAMMING,false);

  detector.detectAndCompute(rgb,mask,refKey,refDesc);

  ref={w:tmp.width,h:tmp.height};

  for(let i=0;i<channels.size();i++){
    channels.get(i).delete();
  }

  channels.delete();
  rgba.delete();
  rgb.delete();

  if(refDesc.empty()||refKey.size()<18){
    throw new Error('No se detectaron suficientes detalles en la imagen');
  }
}

async function init(){
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error('La cámara requiere HTTPS y un navegador compatible');
    }

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    camReady=true;
    say('Cargando reconocimiento visual...');

    await waitCV();
    await loadReference();

    sceneKey=new cv.KeyPointVector();
    sceneDesc=new cv.Mat();
    gray=new cv.Mat();
    maskEmpty=new cv.Mat();

    loading.style.display='none';
    say('Apunta de frente a tu calaverita. La magia iniciará sola.');

    requestAnimationFrame(frame);
  }catch(e){
    showError(
      '⚠️ '+e.message+
      '. Comprueba los permisos, la conexión y que calaverita-referencia.png esté junto a ar.html.'
    );
  }
}

function lost(){
  confirmed=0;
  missing++;

  if(missing>7){
    tracking=null;
    if(!playing){
      say('Buscando tu calaverita... Acércala y enfócala de frente.');
    }
  }
}

function detect(){
  if(!camReady||!cvReady||video.readyState<2||scanBusy)return;

  scanBusy=true;

  let matches=null;
  let src=null;
  let dst=null;
  let H=null;
  let projected=null;
  let pts=null;

  try{
    const vw=video.videoWidth;
    const vh=video.videoHeight;
    if(!vw||!vh)return;

    scanCtx.drawImage(video,0,0,640,480);

    const rgba=cv.imread(scanCanvas);
    cv.cvtColor(rgba,gray,cv.COLOR_RGBA2GRAY);
    rgba.delete();

    detector.detectAndCompute(
      gray,maskEmpty,sceneKey,sceneDesc
    );

    if(sceneDesc.empty()||sceneKey.size()<12){
      lost();
      return;
    }

    matches=new cv.DMatchVectorVector();
    matcher.knnMatch(refDesc,sceneDesc,matches,2);

    const a=[];
    const b=[];

    for(let i=0;i<matches.size();i++){
      const pair=matches.get(i);

      if(pair.size()===2){
        const m=pair.get(0);
        const n=pair.get(1);

        if(m.distance<Math.min(65,n.distance*.74)){
          const p=refKey.get(m.queryIdx).pt;
          const q=sceneKey.get(m.trainIdx).pt;

          a.push(p.x,p.y);
          b.push(q.x,q.y);
        }
      }

      pair.delete();
    }

    if(a.length<28){
      lost();
      return;
    }

    src=cv.matFromArray(
      a.length/2,1,cv.CV_32FC2,a
    );

    dst=cv.matFromArray(
      b.length/2,1,cv.CV_32FC2,b
    );

    const inliers=new cv.Mat();
    H=cv.findHomography(src,dst,cv.RANSAC,4,inliers);

    let count=0;

    for(let i=0;i<inliers.rows;i++){
      if(inliers.ucharAt(i,0))count++;
    }

    inliers.delete();

    if(H.empty()||count<17||count<a.length/2*.45){
      lost();
      return;
    }

    pts=cv.matFromArray(
      4,1,cv.CV_32FC2,
      [
        ref.w*.22,ref.h*.06,
        ref.w*.78,ref.h*.06,
        ref.w*.78,ref.h*.72,
        ref.w*.22,ref.h*.72
      ]
    );

    projected=new cv.Mat();
    cv.perspectiveTransform(pts,projected,H);

    const xs=[];
    const ys=[];

    for(let i=0;i<4;i++){
      xs.push(projected.data32F[i*2]);
      ys.push(projected.data32F[i*2+1]);
    }

    const left=Math.min(...xs);
    const right=Math.max(...xs);
    const top=Math.min(...ys);
    const bottom=Math.max(...ys);

    const w=right-left;
    const h=bottom-top;

    if(
      ![left,right,top,bottom].every(Number.isFinite)||
      w<35||h<60||w>620||h>470||
      right<0||left>640||bottom<0||top>480
    ){
      lost();
      return;
    }

    const next={
      x:(left+right)/2,
      y:(top+bottom)/2,
      w,h
    };

    if(tracking){
      next.x=tracking.x*.65+next.x*.35;
      next.y=tracking.y*.65+next.y*.35;
      next.w=tracking.w*.65+next.w*.35;
      next.h=tracking.h*.65+next.h*.35;
    }

    tracking=next;
    confirmed++;
    missing=0;

    if(confirmed>=3&&!playing){
      playing=true;
      storyStart=performance.now();
      replay.style.display='inline-block';
    }
  }catch(e){
    console.warn('Reconocimiento:',e);
    lost();
  }finally{
    if(matches)matches.delete();
    if(src)src.delete();
    if(dst)dst.delete();
    if(H)H.delete();
    if(projected)projected.delete();
    if(pts)pts.delete();
    scanBusy=false;
  }
}

function line(x1,y1,x2,y2,color='#f5efe4',width=9){
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function circle(x,y,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function laptop(){
  ctx.fillStyle='#7789a6';
  ctx.fillRect(-39,-53,78,48);

  ctx.fillStyle='#52c7f2';
  ctx.fillRect(-34,-48,68,36);

  ctx.fillStyle='#aab4c3';
  ctx.fillRect(-49,-4,98,8);
}

function puppet(t){
  const dance=t>=8&&t<15;
  const throwing=t>=5&&t<8;
  const enter=t>=15;

  const beat=dance?Math.sin((t-8)*8):0;
  const jump=dance?Math.abs(Math.sin((t-8)*7))*12:0;

  ctx.save();
  ctx.translate(0,-jump);

  if(enter){
    const f=Math.min(1,(t-15)/5);
    ctx.scale(1-f*.6,1-f*.6);
    ctx.globalAlpha=1-f*.8;
  }

  // Piernas articuladas.
  line(-20,15,-30,72,'#eee6d1',12);
  line(20,15,30,72,'#eee6d1',12);

  line(-30,72,-33+beat*9,123,'#eee6d1',9);
  line(30,72,33-beat*9,123,'#eee6d1',9);

  // Zapatos cafés.
  ctx.fillStyle='#4b2b24';
  ctx.fillRect(-62+beat*9,112,42,16);
  ctx.fillRect(19-beat*9,112,42,16);

  // Brazos.
  line(-31,-71,-57,-34+beat*12,'#eee6d1',11);
  line(31,-71,57,-34-beat*12,'#eee6d1',11);

  line(-57,-34+beat*12,-62,-1+beat*18,'#eee6d1',9);
  line(57,-34-beat*12,62,-1-beat*18,'#eee6d1',9);

  for(const x of [-57,57]){
    circle(x,-34,5,'#c49c48');
  }

  // Chaleco azul marino.
  ctx.fillStyle='#182a57';
  ctx.beginPath();
  ctx.moveTo(-38,-83);
  ctx.lineTo(38,-83);
  ctx.lineTo(31,10);
  ctx.lineTo(-31,10);
  ctx.closePath();
  ctx.fill();

  line(0,-78,0,7,'#0b152d',3);
  circle(4,-44,4,'#f3eee2');
  circle(4,-22,4,'#f3eee2');

  // Cráneo.
  ctx.fillStyle='#f5f0e4';
  ctx.beginPath();
  ctx.ellipse(0,-116,45,47,0,0,Math.PI*2);
  ctx.fill();

  circle(-17,-124,12,'#211c29');
  circle(17,-124,12,'#211c29');

  // Nariz.
  ctx.fillStyle='#211c29';
  ctx.beginPath();
  ctx.moveTo(0,-111);
  ctx.lineTo(-6,-101);
  ctx.lineTo(6,-101);
  ctx.closePath();
  ctx.fill();

  // Sonrisa.
  ctx.strokeStyle='#211c29';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(0,-112,30,.2,Math.PI-.2);
  ctx.stroke();

  for(let x=-21;x<=21;x+=7){
    line(x,-91,x,-82,'#211c29',1.5);
  }

  // Trabajando.
  if(t<5){
    ctx.save();
    ctx.translate(0,-3);
    laptop();
    ctx.restore();
  }

  // Lanzando la laptop.
  if(throwing){
    const d=t-5;

    if(d<1){
      ctx.save();
      ctx.translate(0,-3-d*25);
      laptop();
      ctx.restore();
    }else{
      const f=d-1;
      ctx.save();
      ctx.translate(f*100,-f*85+f*f*45);
      ctx.rotate(f*4);
      laptop();
      ctx.restore();
    }
  }

  ctx.restore();
}

function portal(t){
  const f=Math.max(0,Math.min(1,(t-15)/1.5));

  ctx.save();
  ctx.globalAlpha=f;

  ctx.strokeStyle='#ff9d25';
  ctx.lineWidth=13;
  ctx.shadowColor='#ff9d25';
  ctx.shadowBlur=18;

  ctx.beginPath();
  ctx.ellipse(0,-45,80,130,0,0,Math.PI*2);
  ctx.stroke();

  ctx.shadowBlur=0;
  ctx.strokeStyle='#a950ff';
  ctx.lineWidth=7;

  ctx.beginPath();
  ctx.ellipse(0,-45,66,113,0,0,Math.PI*2);
  ctx.stroke();

  ctx.restore();
}

function frame(now){
  requestAnimationFrame(frame);

  if(now-lastScan>650){
    lastScan=now;
    detect();
  }

  const dpr=Math.min(devicePixelRatio||1,2);
  const W=innerWidth;
  const H=innerHeight;

  if(
    canvas.width!==Math.round(W*dpr)||
    canvas.height!==Math.round(H*dpr)
  ){
    canvas.width=Math.round(W*dpr);
    canvas.height=Math.round(H*dpr);
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  if(!tracking||!playing)return;

  const t=(now-storyStart)/1000;

  if(t>=20){
    playing=false;
    confirmed=0;
    tracking=null;
    replay.style.display='none';
    say('Historia terminada. Enfoca de nuevo la calaverita.');
    return;
  }

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  if(!vw||!vh)return;

  const fit=Math.max(W/vw,H/vh);
  const ox=(W-vw*fit)/2;
  const oy=(H-vh*fit)/2;

  const x=ox+tracking.x/640*vw*fit;
  const y=oy+tracking.y/480*vh*fit;
  const h=tracking.h/480*vh*fit;

  ctx.save();
  ctx.translate(x,y);

  const scale=Math.max(.3,Math.min(2.2,h/220));
  ctx.scale(scale,scale);

  if(t>=15)portal(t);
  puppet(t);

  ctx.restore();

  say(
    t<5?'💻 Trabajando en la laptop...':
    t<8?'😤 ¡Aventó la computadora!':
    t<15?'💃 ¡A bailar!':
    '✨ ¡Entrando al portal mágico!'
  );
}

replay.onclick=()=>{
  if(tracking){
    playing=true;
    storyStart=performance.now();
  }
};

window.addEventListener('pagehide',()=>{
  const s=video.srcObject;
  if(s){
    s.getTracks().forEach(t=>t.stop());
  }
});

init();
</script>
</body>
</html>
