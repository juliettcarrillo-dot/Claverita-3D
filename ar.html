
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>El Tres Mangas: El bug del más allá</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#130c22;color:white;
  font-family:system-ui,Arial,sans-serif
}
#camera,#three{
  position:fixed;inset:0;width:100%;height:100%
}
#camera{
  object-fit:cover;background:#130c22;z-index:1
}
#three{
  z-index:2;touch-action:none;display:none
}
#header{
  position:fixed;z-index:5;
  top:calc(10px + env(safe-area-inset-top));
  left:10px;right:10px;text-align:center;
  background:#211431d9;
  border:1px solid #ffbc5c;
  border-radius:14px;padding:9px 12px;
  pointer-events:none
}
h1{font-size:16px;color:#ffd47e;margin:0 0 4px}
#status{font-size:12px;line-height:1.4}
#actions{
  position:fixed;z-index:6;
  bottom:calc(12px + env(safe-area-inset-bottom));
  left:8px;right:8px;
  display:flex;justify-content:center;
  flex-wrap:wrap;gap:7px
}
button,a{
  border:0;border-radius:11px;
  padding:11px 12px;font:700 13px system-ui;
  text-decoration:none;cursor:pointer
}
#start,#repeat{background:#ffb94d;color:#25142b}
#repeat{display:none}
#home{background:#d9bdff;color:#281338}
#retry{display:none;background:#ffdca0;color:#29172f}
#help{
  position:fixed;z-index:4;
  bottom:calc(73px + env(safe-area-inset-bottom));
  left:12px;right:12px;text-align:center;
  font-size:12px;text-shadow:0 2px 5px black;
  pointer-events:none
}
#notice{
  position:fixed;z-index:4;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(88vw,360px);
  padding:18px;background:#211431eb;
  border:1px solid #ffbc5c;
  border-radius:16px;text-align:center;
  font-size:14px;line-height:1.5
}
#notice.hidden{display:none}

/* LETREROS DE LA HISTORIA */
#storyBanner{
  position:fixed;
  z-index:8;
  left:50%;
  top:43%;
  width:min(94vw,540px);
  transform:translate(-50%,-50%) scale(.6);
  opacity:0;
  pointer-events:none;
  text-align:center;
  padding:20px 14px;
  border-radius:22px;
  background:rgba(48,7,28,.94);
  border:4px solid #ffcf4d;
  box-shadow:0 0 35px #ff4c3d99;
  transition:opacity .15s,transform .15s;
}
#storyBanner.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1)
}
#storyBanner.warning{
  animation:panic .22s infinite alternate
}
#bannerText{
  font-size:clamp(28px,8vw,55px);
  line-height:1.05;
  font-weight:1000;
  color:#ffe259;
  text-shadow:3px 4px #a91a37
}
#bannerSub{
  margin-top:12px;
  font-size:clamp(14px,4vw,21px);
  font-weight:800;
  color:white
}
@keyframes panic{
  from{transform:translate(-50%,-50%) rotate(-3deg) scale(1)}
  to{transform:translate(-50%,-50%) rotate(3deg) scale(1.07)}
}
</style>
</head>
<body>

<video id="camera" autoplay muted playsinline></video>
<div id="three"></div>

<div id="header">
  <h1>💀 El Tres Mangas: El bug del más allá</h1>
  <div id="status">Preparando cámara...</div>
</div>

<div id="notice">
  📷 Permite el acceso a la cámara para comenzar.
</div>

<div id="storyBanner">
  <div id="bannerText"></div>
  <div id="bannerSub"></div>
</div>

<div id="help">
  Arrastra a El Tres Mangas para moverlo · Pellizca para cambiar su tamaño
</div>

<div id="actions">
  <button id="start">✨ Activar magia</button>
  <button id="repeat">↻ Repetir historia</button>
  <button id="retry">📷 Reintentar cámara</button>
  <a id="home" href="index.html">⌂ Inicio</a>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const video=document.getElementById('camera');
const layer=document.getElementById('three');
const status=document.getElementById('status');
const notice=document.getElementById('notice');
const startBtn=document.getElementById('start');
const repeatBtn=document.getElementById('repeat');
const retryBtn=document.getElementById('retry');
const banner=document.getElementById('storyBanner');
const bannerText=document.getElementById('bannerText');
const bannerSub=document.getElementById('bannerSub');

let stream=null,ready=false,active=false,started=0;

async function cameraOn(){
  retryBtn.style.display='none';
  notice.classList.remove('hidden');
  notice.textContent='📷 Solicitando acceso a la cámara...';
  try{
    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error('Este navegador no permite usar la cámara.');
    }
    if(stream)stream.getTracks().forEach(t=>t.stop());

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    video.srcObject=stream;
    await video.play();
    ready=true;
    notice.classList.add('hidden');
    status.textContent='📷 Cámara lista. ¡Activa la historia de El Tres Mangas!';
  }catch(e){
    ready=false;
    notice.textContent='⚠️ No se pudo abrir la cámara: '+
      (e.name==='NotAllowedError'
      ?'revisa los permisos del sitio.'
      :e.message);
    retryBtn.style.display='inline-block';
    status.textContent='Cámara no disponible';
  }
}
retryBtn.onclick=cameraOn;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(
  40,innerWidth/innerHeight,.1,100
);
camera.position.set(0,1.5,7.7);
camera.lookAt(0,1.5,0);

const renderer=new THREE.WebGLRenderer({
  alpha:true,antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.domElement.style.cssText=
  'width:100%;height:100%;display:block;touch-action:none';
layer.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x76559c,2.6));

const sun=new THREE.DirectionalLight(0xffffff,2.4);
sun.position.set(3,6,5);
scene.add(sun);

const material=(c,em=0)=>new THREE.MeshStandardMaterial({
  color:c,roughness:.58,
  emissive:c,emissiveIntensity:em
});

const bone=material('#eee6cf');
const ink=material('#1b1524');
const navy=material('#152752');
const gold=material('#ffc14d',.3);
const orange=material('#f98c24',.3);
const violet=material('#a95cff',.3);
const shoe=material('#50332c');
const metal=material('#69748b');

function mesh(p,g,m,x=0,y=0,z=0){
  const o=new THREE.Mesh(g,m);
  o.position.set(x,y,z);
  p.add(o);
  return o;
}
function ball(p,r,m,x,y,z,sx=1,sy=1,sz=1){
  const o=mesh(p,new THREE.SphereGeometry(r,16,12),m,x,y,z);
  o.scale.set(sx,sy,sz);
  return o;
}
function box(p,w,h,d,m,x=0,y=0,z=0){
  return mesh(p,new THREE.BoxGeometry(w,h,d),m,x,y,z);
}
function rod(p,a,b,r,m){
  const va=new THREE.Vector3(...a);
  const vb=new THREE.Vector3(...b);
  const dir=vb.clone().sub(va);
  const o=mesh(
    p,
    new THREE.CylinderGeometry(r,r,dir.length(),10),
    m,
    ...va.add(vb).multiplyScalar(.5).toArray()
  );
  o.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.normalize()
  );
  return o;
}

/* El Tres Mangas */
const actor=new THREE.Group();
scene.add(actor);
actor.position.set(0,-.15,0);

const doll=new THREE.Group();
actor.add(doll);

const hips=new THREE.Group();
hips.position.y=1.15;
doll.add(hips);
ball(hips,.28,bone,0,.08,0,1.3,.7,.6);

const torso=new THREE.Group();
torso.position.y=.28;
hips.add(torso);

box(torso,.78,.82,.25,navy,0,.45,0);
box(torso,.09,.74,.28,ink,0,.45,.01);

for(const y of [.30,.56]){
  ball(torso,.045,bone,0,y,.17);
}
rod(torso,[0,.83,0],[0,1.02,0],.07,bone);

const head=new THREE.Group();
head.position.set(0,1.22,.02);
torso.add(head);

ball(head,.47,bone,0,.27,0,1.05,1.06,.66);
ball(head,.33,bone,0,-.03,.1,1,.47,.6);

for(const x of [-.18,.18]){
  ball(head,.13,ink,x,.29,.29,1,1,.28);
}
ball(head,.07,ink,0,.07,.36,.7,1,.25);
box(head,.49,.055,.04,ink,0,-.10,.32);

for(let i=-2;i<=2;i++){
  box(head,.015,.09,.045,ink,i*.09,-.1,.35);
}

function arm(x){
  const p=new THREE.Group();
  p.position.set(x*.43,.78,0);
  torso.add(p);

  rod(p,[0,0,0],[x*.08,-.38,.05],.075,bone);
  ball(p,.10,bone,x*.08,-.38,.05);
  rod(p,[x*.08,-.38,.05],[x*.08,-.75,.22],.06,bone);
  ball(p,.13,bone,x*.08,-.81,.24,1,.7,.4);

  for(let j=0;j<4;j++){
    rod(
      p,
      [x*.08+(j-1.5)*.035,-.83,.25],
      [x*.08+(j-1.5)*.055,-.99,.29],
      .018,bone
    );
  }
  return p;
}
const left=arm(-1);
const right=arm(1);

function leg(x){
  const p=new THREE.Group();
  p.position.set(x*.2,0,0);
  hips.add(p);

  rod(p,[0,0,0],[x*.04,-.43,.02],.09,bone);
  ball(p,.09,bone,x*.04,-.43,.02);
  rod(p,[x*.04,-.43,.02],[x*.05,-.94,.06],.07,bone);
  ball(p,.12,shoe,x*.05,-1.02,.19,1.2,.55,2.1);
  return p;
}
const ll=leg(-1);
const rr=leg(1);

/* LAPTOP */
const laptop=new THREE.Group();
actor.add(laptop);
box(laptop,.72,.045,.46,metal);

const screen=new THREE.Group();
screen.position.set(0,.025,-.21);
laptop.add(screen);

box(screen,.72,.48,.035,metal,0,.24,0);
box(
  screen,.62,.37,.04,
  new THREE.MeshBasicMaterial({color:0x59caff}),
  0,.25,.025
);

for(let r=0;r<3;r++){
  for(let c=0;c<8;c++){
    box(
      laptop,.065,.009,.045,ink,
      (c-3.5)*.082,.027,(r-1)*.105+.04
    );
  }
}

/* PORTAL */
const portal=new THREE.Group();
actor.add(portal);
portal.position.set(0,1.52,-.85);

const outer=mesh(
  portal,
  new THREE.TorusGeometry(1.12,.075,12,72),
  gold
);
const inner=mesh(
  portal,
  new THREE.TorusGeometry(.95,.035,10,72),
  violet
);

mesh(
  portal,
  new THREE.CircleGeometry(.91,64),
  new THREE.MeshBasicMaterial({
    color:0x8d4be3,
    transparent:true,
    opacity:.2,
    side:THREE.DoubleSide
  }),
  0,0,-.06
);

for(let i=0;i<20;i++){
  const a=i/20*Math.PI*2;
  ball(
    portal,.045,i%2?orange:gold,
    1.13*Math.cos(a),
    1.13*Math.sin(a),
    .02
  );
}

const flowers=new THREE.Group();
actor.add(flowers);

for(const x of [-1.15,-.75,.75,1.15]){
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    ball(
      flowers,.085,i%2?orange:gold,
      x+Math.cos(a)*.09,
      .16+Math.sin(a)*.09,
      .22
    );
  }
  ball(flowers,.065,gold,x,.16,.27);
}

const smooth=x=>{
  x=Math.max(0,Math.min(1,x));
  return x*x*(3-2*x);
};

/* LETREROS */
function showBanner(title,subtitle='',warning=false){
  bannerText.textContent=title;
  bannerSub.textContent=subtitle;
  banner.classList.add('show');
  banner.classList.toggle('warning',warning);
}
function hideBanner(){
  banner.classList.remove('show','warning');
}

/* REINICIAR PERSONAJE */
function reset(){
  doll.position.set(0,0,0);
  doll.scale.setScalar(1);

  hips.rotation.set(0,0,0);
  torso.rotation.set(0,0,0);
  head.rotation.set(0,0,0);
  left.rotation.set(0,0,0);
  right.rotation.set(0,0,0);
  ll.rotation.set(0,0,0);
  rr.rotation.set(0,0,0);

  laptop.visible=true;
  laptop.position.set(0,1.6,.58);
  laptop.rotation.set(0,0,0);

  portal.visible=false;
  flowers.visible=false;
}

/* HISTORIA COMPLETA: 20 SEGUNDOS */
function story(t){
  reset();

  const s=performance.now()/1000;

  /* 0 A 5: PROGRAMANDO */
  if(t<5){
    hideBanner();
    status.textContent=
      '💻 El Tres Mangas: ¡Ya quedó! En mi máquina sí funciona.';

    const a=Math.sin(t*17);
    torso.rotation.x=.12;
    head.rotation.x=-.12;
    left.rotation.x=-1.15+a*.12;
    right.rotation.x=-1.15-a*.12;
    left.rotation.z=-.12;
    right.rotation.z=.12;
  }

  /* 5 A 7: ¡AHÍ VIENE LOLIS! */
  else if(t<7){
    showBanner(
      '🚨 ¡AHÍ VIENE LOLIS! 🚨',
      '¡Y YA VIO LOS SACOS DE TRES MANGAS!',
      true
    );

    status.textContent=
      '😱 ¡El Tres Mangas acaba de ver a la jefa de Diseño!';

    const d=t-5;
    head.rotation.z=Math.sin(d*24)*.18;
    torso.rotation.z=Math.sin(d*22)*.12;
    left.rotation.z=-1.3;
    right.rotation.z=1.3;
    left.rotation.x=-.7;
    right.rotation.x=-.7;
    doll.position.y=Math.abs(Math.sin(d*16))*.09;
  }

  /* 7 A 9: AVIENTA LA LAPTOP */
  else if(t<9){
    hideBanner();
    status.textContent=
      '💻💥 ¡NOOO, LOS PANTALONES TAMBIÉN TIENEN MANGAS!';

    const d=t-7;
    const f=d;

    laptop.position.set(
      f*2.5,
      1.6+f*2.2-f*f*1.2,
      .58-f*.4
    );
    laptop.rotation.set(f*5,f*3,f*7);

    left.rotation.z=-1.3;
    right.rotation.z=1.3;
    head.rotation.z=Math.sin(d*12)*.16;
    torso.rotation.z=Math.sin(d*10)*.1;
  }

  /* 9 A 15: BAILA PARA DISIMULAR */
  else if(t<15){
    hideBanner();
    status.textContent=
      '💃 El Tres Mangas baila para disimular el regaño.';

    laptop.visible=false;
    const d=t-9;

    doll.position.set(
      Math.sin(d*3)*.27,
      Math.abs(Math.sin(d*7))*.13,
      0
    );

    hips.rotation.y=Math.sin(d*3)*.27;
    torso.rotation.z=Math.sin(d*5)*.13;
    left.rotation.z=-.95+Math.sin(d*6)*.55;
    right.rotation.z=.95-Math.sin(d*6)*.55;
    ll.rotation.x=Math.sin(d*7)*.65;
    rr.rotation.x=-Math.sin(d*7)*.65;
    head.rotation.z=Math.sin(d*4)*.14;
  }

  /* 15 A 18: HUYE POR EL PORTAL */
  else if(t<18){
    showBanner(
      '💀 ¡NI MUERTO ME SALVO DE LOLIS!',
      '¡CORRE, MANGUITO, CORRE!'
    );

    status.textContent=
      '✨ El Tres Mangas intenta escapar al más allá.';

    laptop.visible=false;
    portal.visible=true;
    flowers.visible=true;

    outer.rotation.z=s*.2;
    inner.rotation.z=-s*.25;

    const f=smooth((t-15)/3);

    doll.position.set(0,0,-f*.65);
    doll.scale.setScalar(1-f*.65);

    ll.rotation.x=Math.sin(s*9)*.5;
    rr.rotation.x=-Math.sin(s*9)*.5;
    left.rotation.x=Math.sin(s*9)*.2;
    right.rotation.x=-Math.sin(s*9)*.2;
  }

  /* 18 A 20: REMATE FINAL */
  else{
    showBanner(
      'ERROR 404 💀',
      'DESARROLLADOR JR. NO ENCONTRADO'
    );

    status.textContent=
      '🪦 Descanse en git peace.';

    laptop.visible=false;
    portal.visible=true;
    flowers.visible=true;

    outer.rotation.z=s*.2;
    inner.rotation.z=-s*.25;

    doll.visible=false;
  }

  if(t<18){
    doll.visible=true;
  }
}

/* BOTONES */
startBtn.onclick=()=>{
  if(!ready){
    notice.textContent=
      'Primero permite el acceso a la cámara.';
    notice.classList.remove('hidden');
    retryBtn.style.display='inline-block';
    return;
  }

  active=true;
  started=performance.now();
  layer.style.display='block';
  startBtn.style.display='none';
  repeatBtn.style.display='inline-block';
  notice.classList.add('hidden');
  hideBanner();
};

repeatBtn.onclick=()=>{
  started=performance.now();
  doll.visible=true;
  hideBanner();
};

/* ARRASTRAR Y PELLIZCAR */
const touches=new Map();
let previousCenter=null;
let previousDistance=null;

function coords(){
  const a=[...touches.values()];
  if(!a.length)return null;

  const center={
    x:a.reduce((v,p)=>v+p.x,0)/a.length,
    y:a.reduce((v,p)=>v+p.y,0)/a.length
  };

  const distance=a.length>1
    ?Math.hypot(
      a[0].x-a[1].x,
      a[0].y-a[1].y
    )
    :null;

  return {center,distance};
}

renderer.domElement.addEventListener('pointerdown',e=>{
  renderer.domElement.setPointerCapture(e.pointerId);
  touches.set(e.pointerId,{
    x:e.clientX,y:e.clientY
  });

  const a=coords();
  previousCenter=a.center;
  previousDistance=a.distance;
});

renderer.domElement.addEventListener('pointermove',e=>{
  if(!touches.has(e.pointerId))return;

  touches.set(e.pointerId,{
    x:e.clientX,y:e.clientY
  });

  const a=coords();

  if(previousCenter){
    actor.position.x+=
      (a.center.x-previousCenter.x)/innerWidth*5;
    actor.position.y-=
      (a.center.y-previousCenter.y)/innerHeight*5;
  }

  if(a.distance&&previousDistance){
    const k=a.distance/previousDistance;
    const next=Math.max(
      .35,Math.min(1.7,actor.scale.x*k)
    );
    actor.scale.setScalar(next);
  }

  previousCenter=a.center;
  previousDistance=a.distance;
});

function release(e){
  touches.delete(e.pointerId);
  const a=coords();
  previousCenter=a?.center||null;
  previousDistance=a?.distance||null;
}

renderer.domElement.addEventListener('pointerup',release);
renderer.domElement.addEventListener('pointercancel',release);

/* ANIMACIÓN */
function frame(now){
  requestAnimationFrame(frame);

  if(active){
    story(((now-started)/1000)%20);
    renderer.render(scene,camera);
  }
}
requestAnimationFrame(frame);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

window.addEventListener('pagehide',()=>{
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
});

cameraOn();
</script>
</body>
